<title>NACI Practice Schedule</title>
<style>
:root{
  --bg:#0f172a; --card:#1e293b; --card2:#273449; --line:#334155;
  --text:#f1f5f9; --muted:#94a3b8; --accent:#38bdf8;
  --free:#22c55e; --freebg:rgba(34,197,94,.12);
  --busy:#e2e8f0; --game:#f59e0b; --gamebg:rgba(245,158,11,.14);
  --mine:#a78bfa; --minebg:rgba(167,139,250,.16); --danger:#f87171;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(15,23,42,.92);backdrop-filter:blur(12px);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:22px;font-weight:700}
header .sub{color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center;justify-content:space-between}
main{padding:12px 14px calc(env(safe-area-inset-bottom) + 90px);max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:rgba(15,23,42,.95);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom) + 6px)}
nav button{flex:1;background:none;border:0;color:var(--muted);font-size:11px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:22px;line-height:1}
nav button.on{color:var(--accent)}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.card h2{margin:0 0 8px;font-size:16px}
.card h3{margin:10px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.slot{width:92px;flex:none;color:var(--muted);font-size:14px}
.what{flex:1;font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.free{color:var(--free);background:var(--freebg)}
.game{color:var(--game);background:var(--gamebg)}
.mine{color:var(--mine);background:var(--minebg)}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{background:var(--accent);color:#04263a;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.5}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.weeknav .t{text-align:center;flex:1;font-weight:700}
.weeknav button{background:var(--card);border:0;color:var(--text);border-radius:10px;width:44px;height:40px;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--accent);color:#04263a;border-color:var(--accent);font-weight:700}
.day{background:var(--card);border-radius:14px;margin:0 0 12px;overflow:hidden}
.day .dh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--card2)}
.day .dh b{font-size:16px}
.day.today .dh{background:#0c4a6e}
.day .db{padding:4px 14px 10px}
.fac{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 2px}
.banner{border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.banner.info{background:rgba(56,189,248,.12);color:#bae6fd}
.banner.warn{background:rgba(245,158,11,.14);color:#fde68a}
.banner.err{background:rgba(248,113,113,.14);color:#fecaca}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-size:16px;font-family:inherit}
textarea{min-height:110px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.game-item{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.game-item:first-child{border-top:0}
.gdate{width:54px;flex:none;text-align:center;background:var(--card2);border-radius:10px;padding:6px 0}
.gdate .m{font-size:11px;color:var(--muted);text-transform:uppercase}
.gdate .d{font-size:20px;font-weight:700}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.sheet .panel{background:var(--card);width:100%;max-width:720px;margin:0 auto;border-radius:18px 18px 0 0;
  padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:90vh;overflow:auto}
.hidden{display:none!important}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
a{color:var(--accent)}

const SHEET_ID = "1-1n945q6kNp5lMjhkuTXX6zT5b43J3TTJWE0XBrxX0U";

/* Credit values from the FYI tab */
const CREDITS = {
  "gym a/b": {morning:2, lunch:1, after:3},

/* Game schedules loaded into the app on first run (and into Firebase the first time a coach signs in).
   Basketball: before Jan 15 a Jr+Sr doubleheader is Jr 3:00 / Sr 4:15; after Jan 15 it flips. Single games 3:30.
   Volleyball: game 1 = 3:00, game 2 = 4:15. */
const SEED_VERSION = "seed-2026-27-v1";
const H = (opp)=>({homeAway:"Home", location:"NACI", opponent:opp});
const A = (school)=>({homeAway:"Away", location:school, opponent:school});
const SEED_GAMES = [

  {id:"bb-0203-jr", date:"2027-02-03", time:"16:15", team:"Jr Basketball", ...H("Weston"), notes:"Doubleheader – Sr at 3:00"},
  {id:"bb-0204-sr", date:"2027-02-04", time:"15:30", team:"Sr Basketball", ...H("West Humber")},
  {id:"bb-0208-jr", date:"2027-02-08", time:"15:30", team:"Jr Basketball", ...H("MCI")},
  {id:"bb-0210-jr", date:"2027-02-10", time:"15:30", team:"Jr Basketball", ...H("KCI")},
  // Volleyball (draft schedule)
  {id:"vb-1202", date:"2026-12-02", time:"16:15", team:"Volleyball", ...H("MCI"), notes:"Game 2 · draft schedule"},
  {id:"vb-1210", date:"2026-12-10", time:"15:00", team:"Volleyball", ...A("ESA"), notes:"Game 1 · draft schedule"},
  {id:"vb-1215", date:"2026-12-15", time:"16:15", team:"Volleyball", ...A("YMCI"), notes:"Game 2 · draft schedule"},
  {id:"vb-0105", date:"2027-01-05", time:"15:00", team:"Volleyball", ...A("WHCI"), notes:"Game 1 · draft schedule"},
  {id:"vb-0106", date:"2027-01-06", time:"15:00", team:"Volleyball", ...H("KCI"), notes:"Game 1 · draft schedule"},
  {id:"vb-0108", date:"2027-01-08", time:"15:00", team:"Volleyball", ...H("HCI"), notes:"Game 1 · draft schedule"},
  {id:"vb-0114", date:"2027-01-14", time:"15:00", team:"Volleyball", ...H("RUNN"), notes:"Game 1 · draft schedule"},
  {id:"vb-0211", date:"2027-02-11", time:"15:00", team:"Volleyball", ...A("WCI"), notes:"Game 1 · draft schedule"},
  {id:"vb-0218", date:"2027-02-18", time:"", team:"Volleyball", homeAway:"TBA", location:"", opponent:"TBA", notes:"Quarterfinals"},
  {id:"vb-0223", date:"2027-02-23", time:"", team:"Volleyball", homeAway:"TBA", location:"", opponent:"TBA", notes:"Semifinals"},
  {id:"vb-0225", date:"2027-02-25", time:"", team:"Volleyball", homeAway:"TBA", location:"", opponent:"TBA", notes:"Finals"},
];
const REFRESH_MS = 2 * 60 * 1000;
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ---------------- date helpers (local time) ---------------- */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fromIso = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => { const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const wd=(x.getDay()+6)%7; return addDays(x,-wd); };
const fmtDay = d => d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
const fmtShort = d => d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
const fmtTime = t => { if(!t) return ""; const [h,m]=t.split(":").map(Number); const ap=h>=12?"PM":"AM"; return `${((h+11)%12)+1}:${String(m).padStart(2,"0")} ${ap}`; };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------------- local storage (wrapped) ---------------- */
const store = {
  get(k,def){ try{ const v=localStorage.getItem(k); return v==null?def:JSON.parse(v);}catch{ return def; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }
};

/* ---------------- state ---------------- */
const state = {
  tab: "today",
  weekStart: mondayOf(new Date()),
  weeks: store.get("weeks", {}),        // mondayISO -> parsed week (cache)
  tabNames: store.get("tabNames", {}),  // mondayISO -> sheet tab name
  overrides: {},                        // mondayISO -> tab name (shared via Firebase)
  games: store.get("localGames", []),
  myTeam: store.get("myTeam", ""),
  facFilter: store.get("facFilter", "All"),
  loading: false, error: "",
  fb: null, user: null,
};

/* =====================================================================
   GOOGLE SHEET READER  (JSONP through the Visualization API – no CORS issues)
   ===================================================================== */
let cbn = 0;
function fetchTab(name){
  return new Promise((resolve,reject)=>{
    const cb = "__sheetcb" + (++cbn);
    const s = document.createElement("script");
    const done = () => { delete window[cb]; s.remove(); clearTimeout(timer); };
    const timer = setTimeout(()=>{ done(); reject(new Error("timeout")); }, 12000);
    window[cb] = data => { done(); resolve(data); };
    s.onerror = () => { done(); reject(new Error("Could not reach Google Sheets")); };
    s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?headers=0&tqx=responseHandler:${cb}&sheet=${encodeURIComponent(name)}&t=${Date.now()}`;
    document.head.appendChild(s);
  });
}
function toGrid(data){
  if(!data || data.status!=="ok" || !data.table) return null;
  return data.table.rows.map(r=>(r.c||[]).map(c=> c && c.v!=null ? String(c.f ?? c.v).replace(/\s+/g," ").trim() : ""));
}

/* All the ways the teachers have written tab names: "Nov 23-27", "Nov 30 - Dec 4", "Sept 14 - 18", "Sept 28-Oct 2" */
function candidateNames(monday){
  const out = new Set();
  const monthNames = m => m===8 ? ["Sept","Sep"] : m===5 ? ["Jun","June"] : m===6 ? ["Jul","July"] : [MON[m]];
  const seps = ["-"," - "," -","- "];
  for(const startOff of [0,1]){           // Monday, or Tuesday when Monday is a holiday
    for(const endOff of [4,3]){           // Friday, or Thursday
      const s = addDays(monday,startOff), e = addDays(monday,endOff);
      for(const sm of monthNames(s.getMonth())) for(const sep of seps){
        if(s.getMonth()===e.getMonth()) out.add(`${sm} ${s.getDate()}${sep}${e.getDate()}`);
        else for(const em of monthNames(e.getMonth())) out.add(`${sm} ${s.getDate()}${sep}${em} ${e.getDate()}`);
      }
    }
  }
  return [...out];
}
const looksLikeWeek = g => g && g.length>1 && g.slice(0,3).some(r=>r.some(c=>/^(mon|tue|wed|thu|fri)/i.test(c)));

/* Turn the grid into facilities -> slots -> 5 days */
function parseWeek(grid, monday, tabName){
  const hi = grid.findIndex(r=>r.some(c=>/^(mon|tue|wed|thu|fri)/i.test(c)));
  const header = grid[hi];
  const colDay = {};  // column index -> 0..4
  header.forEach((c,i)=>{ const k=DAYS.findIndex(d=>c.toLowerCase().startsWith(d.slice(0,3).toLowerCase())); if(k>=0) colDay[i]=k; });
  const facilities = [];
  let cur = null;
  for(const r of grid.slice(hi+1)){
    const label = (r[0]||"").trim();
    if(!label) continue;
    const slotKey = /^(morn|before|am\b)/i.test(label) ? "morning" : /^lunch/i.test(label) ? "lunch" : /^(after|pm\b)/i.test(label) ? "after" : null;
    if(!slotKey){ cur = {name:label, slots:[]}; facilities.push(cur); continue; }
    if(!cur){ cur = {name:"Gym", slots:[]}; facilities.push(cur); }
    const cells = ["","","","",""];
    Object.entries(colDay).forEach(([i,k])=>{ cells[k] = r[i]||""; });
    cur.slots.push({key:slotKey, label: slotKey==="morning"?"Morning":slotKey==="lunch"?"Lunch":"After school", cells});
  }
  const days = DAYS.map((name,k)=>({name, date: iso(addDays(monday,k)), inSheet: Object.values(colDay).includes(k)}));
  return {tab:tabName, monday: iso(monday), days, facilities, fetched: Date.now()};
}

async function loadWeek(monday, {force=false}={}){
  const key = iso(monday);
  const tried = [];
  const known = state.overrides[key] || state.tabNames[key];
  const names = known ? [known, ...candidateNames(monday).filter(n=>n!==known)] : candidateNames(monday);
  const save = (n, grid) => {
    const wk = parseWeek(grid, monday, n);
    state.weeks[key] = wk; state.tabNames[key] = n;
    store.set("weeks", trimCache(state.weeks)); store.set("tabNames", state.tabNames);
    return wk;
  };
  // Fast path: the tab name we already know
  if(known){ const g = toGrid(await fetchTab(known)); if(looksLikeWeek(g)) return save(known, g); }
  // Don't hammer Google looking for a tab that didn't exist a few minutes ago
  const prev = state.weeks[key];
  if(!force && prev && prev.missing && Date.now()-prev.checked < 10*60*1000) return prev;
  // Try every spelling at once, take the first that is a real week tab
  const results = await Promise.allSettled(names.map(fetchTab));
  for(let i=0;i<names.length;i++){
    const g = results[i].status==="fulfilled" ? toGrid(results[i].value) : null;
    if(looksLikeWeek(g)) return save(names[i], g);
  }
  if(results.every(r=>r.status==="rejected")) throw new Error("unreachable");
  const miss = {missing:true, monday:key, checked:Date.now()};
  state.weeks[key] = miss;
  return miss;
}
function trimCache(w){ const keys=Object.keys(w).sort().slice(-6); return Object.fromEntries(keys.map(k=>[k,w[k]])); }

/* ---------------- cell classification ---------------- */
const isGameText = t => /@|\bvs\.?\b|\bgame\b|tourn|\(dh\)|playoff|exhibition/i.test(t);
const isMine = t => state.myTeam && t && t.toLowerCase().includes(state.myTeam.toLowerCase());
const creditFor = (fac, slot) => { const c = CREDITS[fac.toLowerCase().trim()]; return c ? c[slot] : null; };
function cellHtml(text, fac, slotKey){
  if(!text){
    const cr = creditFor(fac, slotKey);
    return `<span class="pill free">Free${cr!=null?` · ${cr} cr`:""}</span>`;
  }
  const tag = isGameText(text) ? `<span class="pill game">Game</span>` : isMine(text) ? `<span class="pill mine">Yours</span>` : "";
  return `<span class="what">${esc(text)}</span>${tag}`;
}
function gamesOn(dateIso){ return state.games.filter(g=>g.date===dateIso).sort((a,b)=>(a.time||"").localeCompare(b.time||"")); }
function gameLine(g){
  return `<div class="row"><div class="slot">${esc(fmtTime(g.time)||"TBA")}</div>
    <div class="what">${esc(g.team)} ${g.homeAway==="Away"?"@":"vs"} ${esc(g.opponent)}
    <div class="small muted">${esc(g.homeAway||"")}${g.location?` · ${esc(g.location)}`:""}${g.notes?` · ${esc(g.notes)}`:""}</div></div>
    <span class="pill game">${esc(g.homeAway||"Home")}</span></div>`;
}
function bookingOpenNote(monday){
  const opens = addDays(monday,-3); opens.setHours(15,0,0,0); // previous Friday 3 PM
  const now = new Date();
  if(now >= monday) return ""; // only useful for upcoming weeks
  if(now >= opens) return `<div class="banner info">Open booking is on — since Friday 3 PM any free slot this week can be booked (credit rules no longer apply).</div>`;
  if(now < opens) return `<div class="banner info small">Open booking for this week starts ${fmtDay(opens)} at 3 PM.</div>`;
  return "";
}

/* =====================================================================
   VIEWS
   ===================================================================== */
const $view = document.getElementById("view");
function setHeader(t, sub){ document.getElementById("title").textContent=t; document.getElementById("subtitle").textContent=sub||""; }
function setStatus(){
  const el = document.getElementById("status");
  if(state.loading){ el.innerHTML = `<span class="spin"></span>`; return; }
  const wk = state.weeks[iso(state.weekStart)];
  el.textContent = wk && wk.fetched ? `Updated ${new Date(wk.fetched).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}` : "";
}

function render(){
  setStatus();
  ({today:renderToday, week:renderWeek, free:renderFree, games:renderGames, settings:renderSettings})[state.tab]();
}

function missingWeekHtml(wk){
  return `<div class="banner warn">The teachers haven't made a tab for the week of ${fmtShort(fromIso(wk.monday))} yet (or it has a name I don't recognise).
    <div class="small" style="margin-top:6px">If a tab exists, set its exact name in <b>Settings → Week tab name</b>.</div></div>`;
}
function errorHtml(){ return state.error ? `<div class="banner err">${esc(state.error)} Showing the last saved copy.</div>` : ""; }

function renderToday(){
  const now = new Date();
  let d = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let note = "";
  const wd = d.getDay();
  if(wd===0 || wd===6){ d = mondayOf(addDays(d, wd===6?2:1)); note = `<div class="banner info">No school today — showing ${fmtDay(d)}.</div>`; }
  else if(now.getHours()>=18){ /* evening: still show today */ }
  const monday = mondayOf(d); const key = iso(monday);
  if(iso(state.weekStart)!==key){ state.weekStart = monday; refresh(); }
  setHeader(fmtDay(d).split(",")[0], fmtDay(d));
  const wk = state.weeks[key];
  const k = (d.getDay()+6)%7;
  const games = gamesOn(iso(d));
  let html = errorHtml() + note;
  html += `<div class="card"><h2>Games</h2>${games.length ? games.map(gameLine).join("") : `<div class="muted small">No games entered for this day.</div>`}</div>`;
  if(!wk){ html += `<div class="card muted">Loading the schedule…</div>`; }
  else if(wk.missing){ html += missingWeekHtml(wk); }
  else {
    let free = 0;
    for(const f of wk.facilities){
      html += `<div class="card"><h2>${esc(f.name)}</h2>`;
      for(const s of f.slots){ if(!s.cells[k]) free++; html += `<div class="row"><div class="slot">${s.label}</div>${cellHtml(s.cells[k], f.name, s.key)}</div>`; }
      html += `</div>`;
    }
    html = `<div class="banner info"><b>${free}</b> free slot${free===1?"":"s"} today.</div>` + html;
  }
  $view.innerHTML = html;
}

function weekNavHtml(){
  const m = state.weekStart;
  return `<div class="weeknav"><button id="prevW">‹</button><div class="t">${fmtShort(m)} – ${fmtShort(addDays(m,4))}
    <div class="small muted">${iso(m)===iso(mondayOf(new Date()))?"This week":iso(m)===iso(addDays(mondayOf(new Date()),7))?"Next week":"&nbsp;"}</div></div><button id="nextW">›</button></div>`;
}
function bindWeekNav(){
  document.getElementById("prevW").onclick=()=>{ state.weekStart=addDays(state.weekStart,-7); render(); refresh(); };
  document.getElementById("nextW").onclick=()=>{ state.weekStart=addDays(state.weekStart,7); render(); refresh(); };
}
function facChips(wk){
  const names = ["All", ...(wk && wk.facilities ? wk.facilities.map(f=>f.name) : [])];
  return `<div class="chips">${names.map(n=>`<button class="chip ${state.facFilter===n?"on":""}" data-fac="${esc(n)}">${esc(n)}</button>`).join("")}</div>`;
}
function bindChips(){ document.querySelectorAll("[data-fac]").forEach(b=>b.onclick=()=>{ state.facFilter=b.dataset.fac; store.set("facFilter",state.facFilter); render(); }); }

function renderWeek(){
  const m = state.weekStart; const wk = state.weeks[iso(m)];
  setHeader("Week", wk && wk.tab ? `Sheet tab: ${wk.tab}` : "");
  let html = errorHtml() + weekNavHtml();
  if(!wk) html += `<div class="card muted">Loading…</div>`;
  else if(wk.missing) html += missingWeekHtml(wk) + weekGamesOnly(m);
  else {
    html += bookingOpenNote(m) + facChips(wk);
    const todayIso = iso(new Date());
    wk.days.forEach((day,k)=>{
      const games = gamesOn(day.date);
      let body = "";
      if(games.length) body += `<div class="fac">Games</div>` + games.map(gameLine).join("");
      let free = 0;
      for(const f of wk.facilities){
        if(state.facFilter!=="All" && f.name!==state.facFilter) continue;
        body += `<div class="fac">${esc(f.name)}</div>`;
        for(const s of f.slots){ if(!s.cells[k]) free++; body += `<div class="row"><div class="slot">${s.label}</div>${cellHtml(s.cells[k], f.name, s.key)}</div>`; }
      }
      html += `<div class="day ${day.date===todayIso?"today":""}"><div class="dh"><b>${day.name}</b><span class="small muted">${fmtShort(fromIso(day.date))} · ${free} free</span></div><div class="db">${body}</div></div>`;
    });
  }
  $view.innerHTML = html; bindWeekNav(); bindChips();
}
function weekGamesOnly(m){
  let out = "";
  for(let k=0;k<5;k++){ const g=gamesOn(iso(addDays(m,k))); if(g.length) out += `<div class="card"><h2>${fmtDay(addDays(m,k))}</h2>${g.map(gameLine).join("")}</div>`; }
  return out;
}

function renderFree(){
  const m = state.weekStart; const wk = state.weeks[iso(m)];
  setHeader("Free to book", "Open slots this week");
  let html = errorHtml() + weekNavHtml();
  if(!wk) html += `<div class="card muted">Loading…</div>`;
  else if(wk.missing) html += missingWeekHtml(wk);
  else {
    html += bookingOpenNote(m) + facChips(wk);
    // Summary: which days have the prime slot (after school) free in each gym
    let summary = "";
    for(const f of wk.facilities){
      if(state.facFilter!=="All" && f.name!==state.facFilter) continue;
      const after = f.slots.find(s=>s.key==="after");
      if(!after) continue;
      const freeDays = wk.days.filter((d,k)=>!after.cells[k]).map(d=>d.name.slice(0,3));
      summary += `<div class="row"><div class="slot">${esc(f.name)}</div><div class="what">${freeDays.length? freeDays.join(", ") : `<span class="muted">Full</span>`}</div></div>`;
    }
    html += `<div class="card"><h2>After school free on…</h2>${summary||'<div class="muted small">—</div>'}</div>`;
    const todayIso = iso(new Date());
    wk.days.forEach((day,k)=>{
      if(day.date < todayIso && iso(m)===iso(mondayOf(new Date()))) return; // hide past days this week
      const items = [];
      for(const f of wk.facilities){
        if(state.facFilter!=="All" && f.name!==state.facFilter) continue;
        for(const s of f.slots) if(!s.cells[k]){ const cr=creditFor(f.name,s.key); items.push(`<div class="row"><div class="slot">${s.label}</div><div class="what">${esc(f.name)}</div>${cr!=null?`<span class="pill free">${cr} cr</span>`:`<span class="pill free">Free</span>`}</div>`); }
      }
      const g = gamesOn(day.date);
      html += `<div class="day ${day.date===todayIso?"today":""}"><div class="dh"><b>${day.name}</b><span class="small muted">${fmtShort(fromIso(day.date))} · ${items.length} free${g.length?` · ${g.length} game${g.length>1?"s":""}`:""}</span></div>
        <div class="db">${items.length?items.join(""):`<div class="muted small" style="padding:8px 0">Nothing free.</div>`}</div></div>`;
    });
    html += `<a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:4px" href="${SHEET_URL}" target="_blank" rel="noopener">Open the sheet to book</a>
      <p class="small muted">Reminder: 5 credits per coach per week, one practice per day, home games take priority.</p>`;
  }
  $view.innerHTML = html; bindWeekNav(); bindChips();
}

function renderGames(){
  setHeader("Games", state.fb ? (state.user ? "Shared with your coaches" : "Sign in to add or edit") : "Saved on this phone only");
  const todayIso = iso(new Date());
  const upcoming = state.games.filter(g=>g.date>=todayIso).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const past = state.games.filter(g=>g.date<todayIso).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const canEdit = !state.fb || state.user;
  const item = g => { const d=fromIso(g.date); return `<div class="game-item" data-id="${esc(g.id)}">
      <div class="gdate"><div class="m">${MON[d.getMonth()]}</div><div class="d">${d.getDate()}</div></div>
      <div style="flex:1"><div style="font-weight:700">${esc(g.team)} ${g.homeAway==="Away"?"@":"vs"} ${esc(g.opponent)}</div>
      <div class="small muted">${d.toLocaleDateString(undefined,{weekday:"short"})} · ${esc(fmtTime(g.time)||"Time TBA")} · ${esc(g.homeAway||"")}${g.location?` · ${esc(g.location)}`:""}</div>
      ${g.notes?`<div class="small">${esc(g.notes)}</div>`:""}</div>
      ${canEdit?`<button class="btn ghost" style="padding:6px 10px;align-self:center" data-edit="${esc(g.id)}">Edit</button>`:""}</div>`; };
  let html = "";
  if(canEdit) html += `<div class="grid2" style="margin-bottom:12px"><button class="btn" id="addGame">+ Add game</button><button class="btn ghost" id="bulkGame">Paste schedule</button></div>`;
  else html += `<div class="banner info">Sign in on the Settings tab to add or edit games.</div>`;
  html += `<div class="card"><h2>Upcoming</h2>${upcoming.length?upcoming.map(item).join(""):'<div class="muted small">No upcoming games yet.</div>'}</div>`;
  if(past.length) html += `<div class="card"><h2>Past</h2>${past.slice(0,30).map(item).join("")}</div>`;
  $view.innerHTML = html;
  if(canEdit){
    document.getElementById("addGame").onclick=()=>gameForm();
    document.getElementById("bulkGame").onclick=bulkForm;
    document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>gameForm(state.games.find(g=>g.id===b.dataset.edit)));
  }
}

function openModal(html){ document.getElementById("modalBody").innerHTML=html; document.getElementById("modal").classList.remove("hidden"); }
function closeModal(){ document.getElementById("modal").classList.add("hidden"); }
document.getElementById("modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });

function gameForm(g){
  const v = g || {date: iso(new Date()), time:"15:30", homeAway:"Home", team: state.myTeam||""};
  openModal(`<h2 style="margin:0 0 6px">${g?"Edit game":"Add game"}</h2>
    <label>Team</label><input id="gTeam" value="${esc(v.team)}" placeholder="e.g. Sr Boys Basketball">
    <label>Opponent</label><input id="gOpp" value="${esc(v.opponent||"")}" placeholder="e.g. Thistletown CI">
    <div class="grid2"><div><label>Date</label><input id="gDate" type="date" value="${esc(v.date)}"></div>
    <div><label>Time</label><input id="gTime" type="time" value="${esc(v.time||"")}"></div></div>
    <div class="grid2"><div><label>Home / Away</label><select id="gHA"><option ${v.homeAway==="Home"?"selected":""}>Home</option><option ${v.homeAway==="Away"?"selected":""}>Away</option><option ${v.homeAway==="TBA"?"selected":""}>TBA</option></select></div>
    <div><label>Location</label><input id="gLoc" value="${esc(v.location||"")}" placeholder="Gym A/B"></div></div>
    <label>Notes</label><input id="gNotes" value="${esc(v.notes||"")}" placeholder="Bus 2:45, bring jerseys">
    <div class="grid2" style="margin-top:14px"><button class="btn ghost" id="gCancel">Cancel</button><button class="btn" id="gSave">Save</button></div>
    ${g?`<button class="btn danger" id="gDel" style="width:100%;margin-top:10px">Delete game</button>`:""}`);
  document.getElementById("gCancel").onclick=closeModal;
  document.getElementById("gSave").onclick=async()=>{
    const data = {team:val("gTeam"), opponent:val("gOpp"), date:val("gDate"), time:val("gTime"), homeAway:val("gHA"), location:val("gLoc"), notes:val("gNotes")};
    if(!data.date || !data.team){ alert("Team and date are needed."); return; }
    await saveGame(g ? g.id : null, data); closeModal(); render();
  };
  if(g) document.getElementById("gDel").onclick=async()=>{ if(confirm("Delete this game for everyone?")){ await deleteGame(g.id); closeModal(); render(); } };
}
const val = id => document.getElementById(id).value.trim();

/* Paste format, one game per line:
   2026-12-03, 15:30, Sr Boys Basketball, Thistletown CI, Home, Gym A/B, notes   */
function bulkForm(){
  openModal(`<h2 style="margin:0 0 6px">Paste a schedule</h2>
    <p class="small muted">One game per line:<br><code>date, time, team, opponent, Home/Away, location, notes</code><br>e.g. <code>2026-12-03, 15:30, Sr Boys Basketball, Thistletown CI, Home, Gym A/B</code></p>
    <textarea id="bulk"></textarea>
    <div class="grid2" style="margin-top:12px"><button class="btn ghost" id="bCancel">Cancel</button><button class="btn" id="bSave">Add games</button></div>`);
  document.getElementById("bCancel").onclick=closeModal;
  document.getElementById("bSave").onclick=async()=>{
    const lines = document.getElementById("bulk").value.split("\n").map(l=>l.trim()).filter(Boolean);
    let n=0, bad=[];
    for(const l of lines){
      const p = l.split(/\t|,/).map(x=>x.trim());
      const date = normDate(p[0]);
      if(!date){ bad.push(l); continue; }
      await saveGame(null,{date, time:normTime(p[1]), team:p[2]||state.myTeam||"", opponent:p[3]||"", homeAway:/^a/i.test(p[4]||"")?"Away":"Home", location:p[5]||"", notes:p.slice(6).join(", ")});
      n++;
    }
    closeModal(); render();
    alert(`Added ${n} game${n===1?"":"s"}.${bad.length?`\nCouldn't read:\n${bad.join("\n")}`:""}`);
  };
}
function normDate(s){
  if(!s) return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d = new Date(s); if(isNaN(d)) return null;
  if(!/\d{4}/.test(s)){ // no year given → school year guess
    const m = d.getMonth(); d.setFullYear(m>=7 ? schoolYearStart() : schoolYearStart()+1);
  }
  return iso(d);
}
function schoolYearStart(){ const n=new Date(); return n.getMonth()>=7 ? n.getFullYear() : n.getFullYear()-1; }
function normTime(s){
  if(!s) return "";
  const m = s.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i); if(!m) return "";
  let h=+m[1]; const mi=+(m[2]||0); const ap=(m[3]||"").toLowerCase();
  if(ap==="pm" && h<12) h+=12; if(ap==="am" && h===12) h=0;
  if(!ap && h<7) h+=12; // "3:30" means 3:30 PM at school
  return `${String(h).padStart(2,"0")}:${String(mi).padStart(2,"0")}`;
}

function renderSettings(){
  setHeader("Settings", "");
  const key = iso(state.weekStart);
  let html = `<div class="card"><h2>My team</h2>
    <p class="small muted">Practices in the sheet that contain this word are marked “Yours”.</p>
    <input id="myTeam" value="${esc(state.myTeam)}" placeholder="e.g. basketball"></div>`;
  html += `<div class="card"><h2>Shared data</h2>`;
  if(!state.fb) html += `<p class="small">Running in <b>this phone only</b> mode — games you add are saved on this device. Add your Firebase config at the top of <code>index.html</code> so every coach sees the same games.</p>`;
  else if(state.user) html += `<p class="small">Signed in as <b>${esc(state.user.email)}</b>. Games sync live for everyone.</p><button class="btn ghost" id="signOut">Sign out</button>`;
  else html += `<p class="small muted">Sign in so you can add and edit games. First time? Enter an email and a password and tap “Create account”.</p>
    <label>Email</label><input id="email" type="email" autocomplete="username">
    <label>Password</label><input id="pw" type="password" autocomplete="current-password">
    <div class="grid2" style="margin-top:12px"><button class="btn ghost" id="signUp">Create account</button><button class="btn" id="signIn">Sign in</button></div>
    <div id="authMsg" class="small" style="margin-top:8px;color:var(--danger)"></div>`;
  html += `</div>`;
  html += `<div class="card"><h2>Week tab name</h2>
    <p class="small muted">The app finds each week's tab by its dates. If the teachers name a tab differently, type its exact name for the week of ${fmtShort(state.weekStart)}.</p>
    <input id="tabOverride" value="${esc(state.overrides[key]||"")}" placeholder="${esc(state.tabNames[key]||"e.g. Nov 30 - Dec 4")}">
    <button class="btn ghost" id="saveTab" style="margin-top:8px">Save tab name</button></div>`;
  html += `<div class="card"><h2>Schedule</h2><p class="small muted">The sheet is re-checked every time you open the app and every 2 minutes while it's open.</p>
    <div class="grid2"><button class="btn ghost" id="refreshNow">Refresh now</button><a class="btn ghost" style="text-align:center;text-decoration:none" href="${SHEET_URL}" target="_blank" rel="noopener">Open sheet</a></div></div>`;
  html += `<div class="card small muted">Add to iPhone: open this page in Safari → Share → <b>Add to Home Screen</b>.</div>`;
  $view.innerHTML = html;
  document.getElementById("myTeam").onchange=e=>{ state.myTeam=e.target.value.trim(); store.set("myTeam",state.myTeam); };
  document.getElementById("refreshNow").onclick=()=>refresh(true);
  document.getElementById("saveTab").onclick=async()=>{ await saveOverride(key, val("tabOverride")); refresh(true); alert("Saved."); };
  if(state.fb && state.user) document.getElementById("signOut").onclick=()=>state.fb.signOut(state.fb.auth);
  if(state.fb && !state.user){
    const go = async create => {
      const msg = document.getElementById("authMsg"); msg.textContent="";
      try{ const fn = create ? state.fb.createUserWithEmailAndPassword : state.fb.signInWithEmailAndPassword; await fn(state.fb.auth, val("email"), document.getElementById("pw").value); }
      catch(e){ msg.textContent = (e.code||e.message||"").replace("auth/","").replace(/-/g," "); }
    };
    document.getElementById("signIn").onclick=()=>go(false);
    document.getElementById("signUp").onclick=()=>go(true);
  }
}

/* =====================================================================
   DATA: games + tab overrides (Firebase if configured, otherwise this phone)
   ===================================================================== */
async function saveGame(id, data){
  if(state.fb){
    const {db, doc, setDoc, addDoc, collection, serverTimestamp} = state.fb;
    const payload = {...data, updatedBy: state.user?.email||"", updatedAt: serverTimestamp()};
    if(id) await setDoc(doc(db,"games",id), payload, {merge:true}); else await addDoc(collection(db,"games"), payload);
  } else {
    if(id) state.games = state.games.map(g=>g.id===id?{...g,...data}:g);
    else state.games.push({...data, id: "g"+Date.now()+Math.random().toString(36).slice(2,6)});
    store.set("localGames", state.games);
  }
}
async function deleteGame(id){
  if(state.fb){ const {db, doc, deleteDoc} = state.fb; await deleteDoc(doc(db,"games",id)); }
  else { state.games = state.games.filter(g=>g.id!==id); store.set("localGames", state.games); }
}
async function saveOverride(key, name){
  if(state.fb && state.user){ const {db, doc, setDoc, deleteDoc} = state.fb; name ? await setDoc(doc(db,"weekTabs",key),{tab:name}) : await deleteDoc(doc(db,"weekTabs",key)); }
  else { if(name) state.overrides[key]=name; else delete state.overrides[key]; store.set("overrides", state.overrides); }
  if(!name) delete state.tabNames[key];
}

function seedLocal(){
  if(store.get(SEED_VERSION, false)) return;
  const have = new Set(state.games.map(g=>g.id));
  state.games.push(...SEED_GAMES.filter(g=>!have.has(g.id)));
  store.set("localGames", state.games); store.set(SEED_VERSION, true);
}
async function seedFirebase(){
  const {db, doc, getDoc, writeBatch} = state.fb;
  try{
    const marker = doc(db,"meta",SEED_VERSION);
    if((await getDoc(marker)).exists()) return;
    const batch = writeBatch(db);
    for(const {id,...g} of SEED_GAMES) batch.set(doc(db,"games",id), {...g, updatedBy:"schedule import"});
    batch.set(marker, {at: Date.now(), by: state.user?.email||""});
    await batch.commit();
  }catch(e){ console.error("seed", e); }
}
async function initFirebase(){
  state.overrides = store.get("overrides", {});
  if(!FIREBASE_CONFIG){ seedLocal(); return; }
  try{
    const V = "10.12.2";
    const app = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const fs  = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const au  = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
    const fbApp = app.initializeApp(FIREBASE_CONFIG);
    const db = fs.initializeFirestore(fbApp, {localCache: fs.persistentLocalCache()});
    const auth = au.getAuth(fbApp);
    state.fb = {db, auth, ...fs, ...au};
    state.games = [];
    // Until the built-in schedule has been copied into Firebase, show it alongside whatever is there.
    let fbGames = [], seeded = true;
    const mergeGames = () => {
      const have = new Set(fbGames.map(g=>g.id));
      state.games = seeded ? fbGames : [...fbGames, ...SEED_GAMES.filter(g=>!have.has(g.id))];
      render();
    };
    fs.onSnapshot(fs.doc(db,"meta",SEED_VERSION), d=>{ seeded = d.exists(); mergeGames(); if(!seeded && state.user) seedFirebase(); },
      e=>{ console.error(e); seeded = false; mergeGames(); });
    fs.onSnapshot(fs.collection(db,"games"), snap=>{ fbGames = snap.docs.map(d=>({id:d.id,...d.data()})); mergeGames(); },
      e=>{ console.error(e); state.error = "Couldn't load games from Firebase."; render(); });
    fs.onSnapshot(fs.collection(db,"weekTabs"), snap=>{
      const before = JSON.stringify(state.overrides);
      state.overrides = Object.fromEntries(snap.docs.map(d=>[d.id,d.data().tab]));
      if(before!==JSON.stringify(state.overrides)) refresh(true);
    }, e=>console.error(e));
    au.onAuthStateChanged(auth, user=>{
      state.user = user;
      if(user) seedFirebase();
      render();
    });
  }catch(e){ console.error(e); state.error = "Couldn't connect to Firebase."; }
}

/* =====================================================================
   REFRESH LOOP
   ===================================================================== */
const inflight = {};
async function refresh(force=false){
  const monday = state.weekStart, key = iso(monday);
  if(inflight[key]) return inflight[key];
  state.loading = true; setStatus();
  inflight[key] = (async()=>{
    try{
      await loadWeek(monday, {force});
      state.error = "";
    }catch(e){ state.error = navigator.onLine ? "Couldn't read the Google Sheet." : "You're offline."; }
    finally{ delete inflight[key]; state.loading = Object.keys(inflight).length>0; render(); }
  })();
  return inflight[key];
}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on", x===b));
  state.tab = b.dataset.tab; window.scrollTo(0,0); render();
});
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") refresh(); });
setInterval(()=>{ if(document.visibilityState==="visible") refresh(); }, REFRESH_MS);

render();
initFirebase().then(()=>{ render(); });
refresh();
</script>
